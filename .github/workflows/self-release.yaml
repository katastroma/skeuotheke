name: Self Release

on:
  workflow_dispatch:
  push:
    branches: [default]
    paths:
      - .github/**

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name '${{ github.actor }}'
          git config user.email '${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com'

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Version Bump
        run: cog bump --auto

      - name: Get Version
        id: version
        run: echo "version=$(cog get-version)" >> $GITHUB_OUTPUT

      - name: Get floating tag
        id: floating
        run: echo "tag=v$(cog get-version | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Push bump commit
        run: git push

      - name: Push release tag
        run: git push origin $(git describe --tags --abbrev=0)

      - name: Update floating major version tag
        run: git tag -f ${{ steps.floating.outputs.tag }}

      - name: Push floating tag
        run: git push origin ${{ steps.floating.outputs.tag }} --force
