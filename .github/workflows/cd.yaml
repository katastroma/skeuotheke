name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      - '!v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Get floating tag
        id: floating
        run: echo "tag=v$(echo "${{ github.ref_name }}" | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Update floating major version tag
        run: git tag -f ${{ steps.floating.outputs.tag }}

      - name: Push floating tag
        run: git push origin ${{ steps.floating.outputs.tag }} --force
