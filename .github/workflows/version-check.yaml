name: Versioning Check

on:
  workflow_dispatch:
  workflow_call:

jobs:
  version-check:
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.head_ref || github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Previous Version
        id: previous
        run: echo "version=$(cog -v get-version)" >> "${GITHUB_OUTPUT}"

      - name: Version Bump
        run: cog bump --auto

      - name: New Version
        id: new
        run: echo "version=$(cog -v get-version)" >> "${GITHUB_OUTPUT}"

      - name: Display Version Info
        id: check
        run: |
          echo "Incoming SHA: ${{ env.SHA }}"
          echo "Current version: ${{ steps.previous.outputs.version }}"

          echo "Bumped SHA: $(git rev-parse HEAD)"
          echo "New version: ${{ steps.new.outputs.version }}"

          if [ "${{ steps.previous.outputs.version }}" != "${{ steps.new.outputs.version }}" ]; then
            echo "Version bumped to: ${{ steps.new.outputs.version }}"
          else
            echo "No version bump detected"
          fi
