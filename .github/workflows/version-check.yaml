name: Versioning Check

on:
  workflow_dispatch:
  workflow_call:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Version Bump
        run: cog bump --auto

      - name: Current Version
        id: current
        run: echo "version=$(cog -v get-version)" >> "${GITHUB_OUTPUT}"

      - name: Check if bumped
        id: check
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "bumped=true" >> "${GITHUB_OUTPUT}"
          else
            echo "bumped=false" >> "${GITHUB_OUTPUT}"
          fi
