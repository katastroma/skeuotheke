name: Versioning Check

on:
  workflow_dispatch:
  workflow_call:

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.base_ref || github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Previous Version
        id: previous
        run: echo "version=$(cog -v get-version)" >> "${GITHUB_OUTPUT}"

      - name: Version Bump
        run: cog bump --auto

      - name: New Version
        id: new
        run: echo "version=$(cog -v get-version)" >> "${GITHUB_OUTPUT}"

      - name: Check if bumped
        id: check
        run: |
          echo "Current version: ${{ steps.previous.outputs.version }}"
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "Version bumped to: ${{ steps.new.outputs.version }}"
          else
            echo "No version bump detected"
          fi
