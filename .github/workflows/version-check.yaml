name: Versioning Check

on:
  workflow_dispatch:
  workflow_call:

jobs:
  version-check:
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.head_ref || github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Previous SHA
        id: previous-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Previous Version
        id: previous-version
        run: echo "version=$(cog -v get-version)" >> "${GITHUB_OUTPUT}"

      - name: Version Bump
        run: cog bump --auto

      - name: New Version
        id: new-version
        run: echo "version=$(cog -v get-version)" >> "${GITHUB_OUTPUT}"

      - name: Display Version Info
        id: check
        env:
          PREV_VERSION: ${{ steps.previous-version.outputs.version }}
          NEW_VERSION: ${{ steps.new-version.outputs.version }}
        run: |
          echo "Previous SHA: ${{ steps.previous-sha.outputs.sha }}"
          echo "Current version: ${{ env.PREV_VERSION }}"
          echo "New SHA: $(git rev-parse HEAD)"

          if [ "${{ env.PREV_VERSION }}" != "${{ env.NEW_VERSION }}" ]; then
            echo "Version would be bumped to: ${{ env.NEW_VERSION }}"
          else
            echo "No version bump detected"
          fi
