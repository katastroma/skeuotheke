name: Versioning Check

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cog-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.base_ref || github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Check commits
        run: cog check
