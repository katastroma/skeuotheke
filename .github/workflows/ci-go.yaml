name: Go CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      working_directory:
        default: ${{ github.workspace }}
        type: string
        description: Working directory for go code

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - run: go mod download

      - name: Format check
        run: go fmt ./...

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -cover ./...
