name: Go CI

on:
  workflow_dispatch:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - run: go mod download

      - name: Format check
        run: go fmt ./...

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -cover ./...
