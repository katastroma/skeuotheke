name: Go CI

on:
  workflow_dispatch:
  workflow_call:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: go fmt
        run: go fmt ./...

      - name: go vet
        run: go vet -diff ./...

      - name: go test
        run: go test -cover ./...
